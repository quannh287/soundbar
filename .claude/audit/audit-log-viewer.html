<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit-log viewer</title>
<!--
  audit-log-viewer.html — human view cho .specs/audit/audit-log.jsonl (011 Bước 7).
  Thiết kế port từ Claude Design "Audit Log Viewer" (project 89ba013a) — timeline
  left-rail + badge, serif prompt, live/paused + time-format toggle, dark expand panel.
  Static, self-contained, zero-dep, KHÔNG gọi mạng ngoài (font hệ thống — audit tool
  không phone-home). PHẢI chạy qua serve.py (localhost) — file:// không fetch() được.
  Data layer live: fetch audit-log.jsonl (poll conditional-GET), lazy sidecar
  diff/tool-results/says (encodeURIComponent cho '#edit'/'#say', Range cho blob lớn). windowed
  scroll-up. KHÔNG bịa dữ liệu thiếu (007 §6). Narration `kind:say` = lời agent (011 Bước 9) —
  bong bóng tách spine, pill "Say" bật/tắt để soi say-do divergence.
-->
<style>
  :root {
    --primary:#cc785c; --primary-active:#a9583e;
    --ink:#141413; --body:#3d3d3a; --body-strong:#252523;
    --muted:#6c6a64; --muted-soft:#8e8b82; --faint:#a09d96; --faintest:#b8b3aa;
    --hairline:#e6dfd8; --hairline-soft:#ebe6df;
    --canvas:#faf9f5; --surface-soft:#f5f0e8; --cream:#efe9de; --cream-strong:#e8e0d2;
    --row:#fbfaf7; --white:#ffffff;
    --teal:#5db8a6; --teal-text:#3f8b7c;
    --amber:#d4a017; --amber-2:#e8a55a; --amber-text:#8a6d14;
    --success:#5db872; --success-text:#3f9350;
    --dark:#181715; --dark-border:#252320; --dark-txt:#d9d4cc; --dark-txt2:#c9c4bc; --dark-txt3:#8e8b82;
    --on-dark:#faf9f5;   /* text sáng nhất trên panel tối (panel luôn tối ở cả 2 theme) */
    --scroll:#d9d2c7; --ic-fg:#c0392b;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:Georgia,"Times New Roman",serif;   /* Georgia phủ đủ dấu tiếng Việt (Iowan/Palatino fallback bể dấu) */
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  /* dark = biến thể warm-dark (brand vốn light-first; panel code luôn tối) */
  @media (prefers-color-scheme:dark){ :root:not([data-theme]){
    --ink:#faf9f5; --body:#d7d3ca; --body-strong:#ece8e0;
    --muted:#a7a39a; --muted-soft:#8a877f; --faint:#736f68; --faintest:#5c5952;
    --hairline:#2c2a26; --hairline-soft:#242320;
    --canvas:#141311; --surface-soft:#1c1a17; --cream:#211f1b; --cream-strong:#2a2723;
    --row:#1b1a16; --white:#242220;
    --primary-active:#e0a488; --teal-text:#79cdbb; --amber-text:#e2b24e; --success-text:#6cc47f;
    --dark:#0f0e0d; --dark-border:#2a2824; --dark-txt:#d9d4cc; --dark-txt2:#c9c4bc; --dark-txt3:#9a968d;
    --scroll:#3a3733; --ic-fg:#f0928c;
  }}
  :root[data-theme="dark"]{
    --ink:#faf9f5; --body:#d7d3ca; --body-strong:#ece8e0;
    --muted:#a7a39a; --muted-soft:#8a877f; --faint:#736f68; --faintest:#5c5952;
    --hairline:#2c2a26; --hairline-soft:#242320;
    --canvas:#141311; --surface-soft:#1c1a17; --cream:#211f1b; --cream-strong:#2a2723;
    --row:#1b1a16; --white:#242220;
    --primary-active:#e0a488; --teal-text:#79cdbb; --amber-text:#e2b24e; --success-text:#6cc47f;
    --dark:#0f0e0d; --dark-border:#2a2824; --dark-txt:#d9d4cc; --dark-txt2:#c9c4bc; --dark-txt3:#9a968d;
    --scroll:#3a3733; --ic-fg:#f0928c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--canvas);}
  body{font-family:var(--sans);-webkit-font-smoothing:antialiased;color:var(--body);
    display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  a{color:var(--primary);text-decoration:none;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:6px;border:2px solid var(--canvas);}
  .alv-scroll{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent;}
  @keyframes alvPulse{0%{box-shadow:0 0 0 0 rgba(93,184,114,0.5);}70%{box-shadow:0 0 0 6px rgba(93,184,114,0);}100%{box-shadow:0 0 0 0 rgba(93,184,114,0);}}
  @keyframes alvFlash{0%{background:rgba(204,120,92,0.14);}100%{background:transparent;}}

  /* ===== header ===== */
  header{flex:0 0 auto;background:var(--canvas);border-bottom:1px solid var(--hairline);z-index:20;}
  .hdr{max-width:940px;margin:0 auto;height:60px;display:flex;align-items:center;gap:14px;padding:0 24px;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand svg{flex:0 0 auto;}
  .brand .name{font-size:16px;font-weight:600;letter-spacing:-.2px;color:var(--ink);}
  .src-chip{font-family:var(--mono);font-size:12px;color:var(--muted-soft);background:var(--surface-soft);
    border:1px solid var(--hairline-soft);padding:3px 8px;border-radius:6px;white-space:nowrap;}
  .hdr .grow{flex:1 1 auto;}
  .hdr-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
  .hdr-meta .count{font-family:var(--mono);}
  .vdiv{width:1px;height:16px;background:var(--hairline);}
  .local{display:inline-flex;align-items:center;gap:5px;color:var(--success);font-weight:500;}
  .local .d{width:6px;height:6px;border-radius:50%;background:var(--success);}
  .live-btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 14px;border-radius:9999px;
    font-size:12.5px;font-weight:600;font-family:var(--sans);cursor:pointer;
    border:1px solid rgba(93,184,114,.4);background:rgba(93,184,114,.1);color:var(--success-text);}
  .live-btn.paused{border-color:var(--hairline);background:transparent;color:var(--muted-soft);}
  .icon-btn{width:32px;height:32px;border-radius:9999px;border:1px solid var(--hairline);background:transparent;
    color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .icon-btn:hover{border-color:var(--primary);color:var(--primary);}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--success);animation:alvPulse 1.8s infinite;}
  .live-btn.paused .live-dot{background:#c9c1b3;animation:none;}

  /* ===== filter bar ===== */
  .filterbar{flex:0 0 auto;background:var(--canvas);border-bottom:1px solid var(--hairline);z-index:15;}
  .filters{max-width:940px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  select.sel{height:38px;padding:0 30px 0 12px;background:var(--white);border:1px solid var(--hairline);
    border-radius:8px;font-size:13px;color:var(--body-strong);font-family:var(--sans);cursor:pointer;max-width:220px;}
  select.sel:focus{outline:none;border-color:var(--primary);}
  .pillrow{display:flex;gap:6px;}
  .pill{height:32px;padding:0 13px;border-radius:9999px;font-size:12.5px;font-weight:500;font-family:var(--sans);
    cursor:pointer;border:1px solid var(--hairline);background:transparent;color:var(--muted-soft);}
  .pill.on{border-color:var(--primary);background:rgba(204,120,92,.1);color:var(--primary-active);}
  .segmented{display:inline-flex;gap:2px;padding:3px;background:var(--cream);border:1px solid var(--hairline);border-radius:9px;}
  .seg{display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;border:none;
    border-radius:7px;cursor:pointer;color:var(--faint);background:transparent;}
  .seg.on{color:var(--primary-active);background:var(--white);box-shadow:0 1px 2px rgba(20,20,19,.08);}

  /* ===== scroll ===== */
  #scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;background:var(--canvas);}
  .wrap{max-width:940px;margin:0 auto;padding:28px 24px 120px;}
  .load-earlier{display:flex;justify-content:center;margin-bottom:22px;}
  .load-earlier button{height:34px;padding:0 18px;background:var(--white);border:1px solid var(--hairline);
    border-radius:9999px;font-size:13px;font-weight:500;color:var(--muted);font-family:var(--sans);cursor:pointer;}
  .load-earlier button:hover{border-color:var(--primary);color:var(--ink);}
  .oldest{text-align:center;color:var(--faint);font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:22px;}
  .empty{text-align:center;padding:80px 0;color:var(--muted-soft);}
  .empty h2{font-family:var(--serif);font-size:24px;color:var(--muted);margin:0 0 8px;letter-spacing:-.3px;font-weight:400;}
  .empty p{margin:0;font-size:14px;}

  /* ===== group (unit) ===== */
  .group{margin-bottom:26px;}
  .group:last-child{margin-bottom:4px;}
  .ghead{display:flex;gap:14px;align-items:flex-start;}
  .railcol{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding-top:2px;}
  .badge{width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff;}
  .badge.prompt{border-radius:50%;background:var(--primary);}
  .badge.skill{border-radius:9px;background:var(--dark);}
  .badge.missing{border-radius:9px;background:var(--amber);}
  .badge.system{border-radius:9px;background:var(--muted-soft);}
  .connector{flex:1 1 auto;width:2px;background:var(--hairline);margin-top:6px;min-height:8px;}
  .gbody{flex:1 1 auto;min-width:0;padding-bottom:6px;}
  .gmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px;padding-right:34px;}
  .kindpill{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600;padding:3px 9px;border-radius:9999px;}
  .kindpill.prompt{color:var(--primary-active);background:rgba(204,120,92,.14);}
  .kindpill.skill{color:var(--teal-text);background:rgba(93,184,166,.16);}
  .kindpill.missing{color:var(--amber-text);background:rgba(212,160,23,.14);}
  .kindpill.system{color:var(--muted);background:var(--surface-soft);border:1px solid var(--hairline-soft);}
  .gmeta .systag{font-family:var(--mono);font-size:10.5px;color:var(--muted-soft);background:var(--surface-soft);
    border:1px solid var(--hairline-soft);padding:2px 7px;border-radius:6px;}
  .gmeta .sess{font-family:var(--mono);font-size:11px;color:var(--muted-soft);}
  .gmeta .branch{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted-soft);font-family:var(--mono);}
  .gmeta .branch .glyph{opacity:.6;}
  .gmeta .gtime{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;}
  .prompt-text{font-family:var(--serif);font-size:20px;line-height:1.35;color:var(--ink);letter-spacing:-.3px;
    white-space:pre-wrap;word-break:break-word;}
  .prompt-code{margin:10px 0 0;background:var(--canvas);border:1px solid var(--hairline);border-radius:8px;
    padding:12px 14px;font-family:var(--mono);font-size:13px;line-height:1.55;color:var(--body-strong);
    white-space:pre-wrap;word-break:break-word;overflow-x:auto;}
  .prompt-text + .prompt-code,.prompt-code + .prompt-text{margin-top:10px;}
  .prompt-text .ic{font-family:var(--mono);font-size:.86em;color:var(--ic-fg);
    background:rgba(198,69,69,.09);border:1px solid rgba(198,69,69,.22);
    padding:1px 5px;border-radius:5px;white-space:pre-wrap;word-break:break-word;}
  .skill-text{font-family:var(--mono);font-size:16px;color:var(--ink);font-weight:500;}
  /* system-injected prompt (harness bơm, KHÔNG phải user gõ) — rút gọn 1 dòng, mono+muted */
  .system-text{font-family:var(--mono);font-size:13px;line-height:1.5;color:var(--muted);
    white-space:pre-wrap;word-break:break-word;}
  .skill-text .slash{color:var(--primary);}
  .attachments{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;}
  .att{display:inline-flex;align-items:center;gap:5px;max-width:100%;font-family:var(--mono);font-size:11.5px;
    color:var(--muted);background:var(--surface-soft);border:1px solid var(--hairline-soft);
    padding:3px 9px;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .att svg{opacity:.7;flex:0 0 auto;}
  .hidden-note,.nochildren{font-size:13px;color:var(--faint);font-style:italic;}
  .dangling-note{font-size:13px;color:var(--amber-text);font-style:italic;}

  /* ===== children ===== */
  .children{display:flex;gap:14px;}
  .crailcol{flex:0 0 32px;display:flex;justify-content:center;}
  .crail{width:2px;background:var(--hairline);align-self:stretch;min-height:12px;}
  .rows{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px;padding:4px 0;}

  /* ===== sub-agent nested block (007 §11) ===== */
  .subagent{border:1px solid rgba(93,184,166,.35);border-radius:10px;background:rgba(93,184,166,.05);
    border-left:3px solid var(--teal);overflow:hidden;}
  .subagent.orphan{border-color:rgba(212,160,23,.4);border-left-color:var(--amber);background:rgba(212,160,23,.05);}
  .sahead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid rgba(93,184,166,.22);}
  .subagent.orphan .sahead{border-bottom-color:rgba(212,160,23,.25);}
  .satag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;
    font-weight:600;color:var(--teal-text);}
  .subagent.orphan .satag{color:var(--amber-text);}
  .satype{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--body-strong);}
  .saId{font-family:var(--mono);font-size:11px;color:var(--muted-soft);}
  .saorphan{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--amber-text);
    background:rgba(212,160,23,.14);padding:2px 8px;border-radius:9999px;}
  .sarows{display:flex;flex-direction:column;gap:8px;padding:10px 12px;}
  .sarows .subagent{background:rgba(93,184,166,.09);}

  /* ===== say (narration, 011 Bước 9) — lời agent, tách khỏi spine bằng-chứng ===== */
  .say{display:flex;gap:9px;align-items:flex-start;padding:1px 0;}
  .sayglyph{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(204,120,92,.13);color:var(--primary-active);margin-top:1px;}
  .saybubble{flex:1 1 auto;min-width:0;background:rgba(204,120,92,.06);border:1px solid rgba(204,120,92,.22);
    border-radius:4px 12px 12px 12px;padding:9px 13px;}
  .say.sub .sayglyph{background:rgba(93,184,166,.14);color:var(--teal-text);}
  .say.sub .saybubble{background:rgba(93,184,166,.06);border-color:rgba(93,184,166,.22);}
  .saytext{font-family:var(--serif);font-size:14px;line-height:1.55;color:var(--body-strong);
    white-space:pre-wrap;word-break:break-word;}
  .saymeta{margin-top:6px;display:flex;gap:8px;align-items:center;font-size:10.5px;color:var(--faint);font-family:var(--mono);}
  .sayloading{color:var(--faint);font-style:italic;font-size:12.5px;}
  .sayfull{margin-top:8px;background:transparent;color:var(--primary-active);border:1px solid rgba(204,120,92,.3);
    border-radius:6px;padding:5px 11px;font:500 12px var(--sans);cursor:pointer;}

  .row{background:var(--row);border:1px solid var(--hairline-soft);border-radius:10px;overflow:hidden;}
  .row.open{background:var(--white);border-color:var(--hairline);}
  .rowhead{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;background:transparent;
    border:none;text-align:left;cursor:pointer;font-family:var(--sans);}
  .chip{flex:0 0 auto;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:12px;font-weight:600;}
  .chip.tool{background:var(--cream-strong);color:var(--muted);}
  .chip.edit{background:rgba(93,184,166,.18);color:var(--teal-text);}
  .clabel{font-family:var(--mono);font-size:14px;color:var(--body-strong);font-weight:600;flex:0 0 auto;}
  .csummary{font-family:var(--mono);font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;flex:1 1 auto;min-width:0;}
  .cmeta{flex:0 0 auto;font-size:10.5px;font-weight:600;color:var(--amber-text);background:rgba(212,160,23,.14);
    padding:2px 8px;border-radius:9999px;}
  .ctime{flex:0 0 auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;font-family:var(--mono);}
  .caret{flex:0 0 auto;width:12px;text-align:center;color:var(--faint);font-size:17px;transition:transform .15s;line-height:1;}
  .row.open .caret{transform:rotate(90deg);}

  /* ===== expanded dark panel ===== */
  .cbody{display:none;padding:0 12px 12px;}
  .row.open .cbody{display:block;}
  .panel{background:var(--dark);border-radius:10px;overflow:hidden;border:1px solid var(--dark-border);}
  .psec{padding:12px 16px;}
  .psec + .psec{border-top:1px solid var(--dark-border);}
  .plabel{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dark-txt3);font-weight:600;margin-bottom:8px;
    display:flex;align-items:center;gap:8px;}
  pre{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:var(--dark-txt);
    white-space:pre-wrap;word-break:break-word;}
  .psec pre.result{max-height:300px;overflow:auto;color:var(--dark-txt2);}
  .blobbadge{font-size:10.5px;font-family:var(--mono);color:var(--dark-txt3);background:var(--dark-border);padding:2px 8px;border-radius:6px;font-weight:400;letter-spacing:0;text-transform:none;}
  .blobbadge.warn{color:var(--amber-2);}
  .miss{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(212,160,23,.1);
    border:1px dashed rgba(212,160,23,.4);border-radius:8px;font-size:12.5px;color:var(--amber-2);}
  .miss .bang{font-weight:700;}
  .loadfull{margin-top:10px;background:var(--dark-border);color:var(--dark-txt);border:1px solid #3a3733;
    border-radius:6px;padding:8px 14px;font:500 12.5px var(--sans);cursor:pointer;}
  .dark-loading{color:var(--dark-txt3);font-size:12.5px;}

  /* diff */
  .psec + .diff-head{border-top:1px solid var(--dark-border);}
  .diff-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--dark-border);}
  .diff-head .path{font-family:var(--mono);font-size:12.5px;color:var(--dark-txt);flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .diff-head .adds{font-size:12px;color:#8fd6a0;font-family:var(--mono);}
  .diff-head .dels{font-size:12px;color:#e79a9a;font-family:var(--mono);}
  .difflines{max-height:340px;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.55;}
  .dl{display:flex;padding:0 12px;}
  .dl .sign{display:inline-block;width:16px;text-align:center;opacity:.7;flex:0 0 auto;}
  .dl .txt{white-space:pre-wrap;word-break:break-word;}
  .dl.add{background:rgba(93,184,114,.13);color:#9fdcaf;}
  .dl.del{background:rgba(198,69,69,.15);color:#e79a9a;}
  .dl.hunk{background:rgba(93,184,166,.12);color:var(--teal);padding:2px 12px;}
  .dl.ctx{color:var(--faint);}

  /* AskUserQuestion Q&A panel */
  .panel.ask{padding:4px 0;}
  .ask-q{padding:13px 16px;}
  .ask-q + .ask-q{border-top:1px solid var(--dark-border);}
  .ask-qhead{margin-bottom:9px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .ask-tag{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dark-txt3);font-weight:600;
    background:var(--dark-border);padding:2px 8px;border-radius:9999px;flex:0 0 auto;}
  .ask-qtext{color:var(--on-dark);font-weight:600;font-size:13.5px;line-height:1.4;}
  .ask-opts{display:flex;flex-direction:column;gap:5px;}
  .ask-opt{display:flex;align-items:flex-start;gap:8px;padding:7px 11px;border-radius:7px;font-size:12.5px;line-height:1.45;
    color:var(--dark-txt3);border:1px solid transparent;background:rgba(255,255,255,.03);}
  .ask-opt .ask-mark{flex:0 0 auto;width:14px;text-align:center;color:var(--dark-txt3);}
  .ask-opt.chosen{background:rgba(204,120,92,.15);border-color:rgba(204,120,92,.5);color:var(--on-dark);font-weight:500;}
  .ask-opt.chosen .ask-mark{color:var(--primary);}
  .ask-opt.custom{background:rgba(204,120,92,.12);border-color:rgba(204,120,92,.4);color:#f0c9ba;}

<body>

<script>
"use strict";
const WINDOW = 15, POLL_MS = 2000, RESULT_CAP = 262144, LCS_MAX = 400000;

const SVG_PROMPT = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 20l1.4-4a8.5 8.5 0 0 1 3.8-11.6 8.38 8.38 0 0 1 4.3-1.1A8.5 8.5 0 0 1 21 11.5z"/></svg>';
const SVG_SKILL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>';
const SVG_CLIP = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>';
const SVG_SUN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const SVG_MOON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
const SVG_AGENT = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V4M8 4h8"/><circle cx="9" cy="14" r="1"/><circle cx="15" cy="14" r="1"/></svg>';
const SVG_SAY = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
const SVG_SYSTEM = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>';

const el = (id) => document.getElementById(id);
const scrollEl = el("scroll"), listEl = el("list");

let allUnits = [], view = [], startIdx = 0, lastMod = null, totalEvents = 0;
let live = true, timeFmt = "absolute";
const kinds = { input: true, tool: true, edit: true, say: true, system: true };
// Prompt do HARNESS bơm (không phải user gõ) — nhận diện bằng wrapper tag đứng đầu (sau trim).
// Chỉ những tag CHẮC CHẮN synthetic-standalone (task-notification) để 0 false-positive: <system-reminder>
// thường được PREPEND vào lượt user thật nên KHÔNG tính (sẽ nuốt nhầm prompt thật). Dễ mở rộng.
const SYSTEM_TAGS = ["task-notification"];
function systemPromptTag(text) {
  const t = String(text || "").replace(/^﻿/, "").trimStart();
  for (const tag of SYSTEM_TAGS) if (t.startsWith("<" + tag + ">") || t.startsWith("<" + tag + " ")) return tag;
  return null;
}
// Rút gọn notification XML → một dòng có nghĩa (task-notification: lấy <summary>, không thì gom chữ).
function systemSummary(tag, text) {
  const s = String(text || "");
  if (tag === "task-notification") {
    const sum = (s.match(/<summary>([\s\S]*?)<\/summary>/) || [])[1];
    if (sum) return sum.trim();
  }
  return s.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().slice(0, 240);
}
const expanded = new Set();        // child id -> đang mở (bền qua re-render)
const resultCache = new Map();     // id -> {text,total,full} — khỏi refetch khi re-render
const diffCache = new Map();       // id -> {lines,adds,dels} | {raw}
const sayCache = new Map();        // id -> {text,total} — lời agent (011 Bước 9), lazy sidecar

// ---- fetch + parse -------------------------------------------------------
async function fetchLog() {
  const headers = {};
  if (lastMod) headers["If-Modified-Since"] = lastMod;
  const res = await fetch("audit-log.jsonl", { headers, cache: "no-store" });
  if (res.status === 304) return null;
  if (!res.ok) throw new Error("HTTP " + res.status);
  lastMod = res.headers.get("Last-Modified");
  return await res.text();
}
function parse(text) {
  const events = [];
  for (const line of text.split("\n")) {
    const s = line.trim(); if (!s) continue;
    try { events.push(JSON.parse(s)); } catch { /* dòng hỏng: bỏ, không sập */ }
  }
  return events;
}
// Toàn bộ event của một unit (kể cả sub-agent) — cho ts/filter (007 §11).
function allEvents(u) {
  const evs = [u.input, ...u.children];
  for (const s of u.subAgents.values()) evs.push(...s.children);
  return evs.filter(Boolean);
}
function buildUnits(events) {
  totalEvents = events.length;
  const byUnit = new Map();
  const getU = (k) => { if (!byUnit.has(k)) byUnit.set(k, { key: k, input: null, children: [], subAgents: new Map(), taskToAgent: null }); return byUnit.get(k); };
  const agentMap = new Map();   // child agent_id -> spawning Task tool_use_id (007 §11 map)
  for (const e of events) {
    if (e.kind === "input") getU(e.id).input = e;
    else if (e.kind === "tool" || e.kind === "edit" || e.kind === "say") {
      // say gom vào children như tool/edit → split own/sub theo meta.agent_id dùng chung (007 §11)
      getU(e.unit_ref || ("(no-unit) " + e.id)).children.push(e);
      if (e.kind === "tool" && e.spawned_agent) agentMap.set(e.spawned_agent, e.id);
    }
  }
  const taskToAgent = new Map();   // task_use_id -> agent_id (reverse, global — chỉ hit trong unit chứa Task)
  for (const [aid, tid] of agentMap) taskToAgent.set(tid, aid);
  const units = [...byUnit.values()];
  for (const u of units) {
    // tách event sinh trong sub-agent (meta.agent_id) ra khỏi luồng main-agent
    const own = [];
    for (const e of u.children) {
      const aid = e.meta && e.meta.agent_id;
      if (aid) {
        if (!u.subAgents.has(aid)) u.subAgents.set(aid, { agentId: aid, agentType: (e.meta && e.meta.agent_type) || "?", children: [] });
        u.subAgents.get(aid).children.push(e);
      } else own.push(e);
    }
    u.children = own;
    u.taskToAgent = taskToAgent;
    const byTs = (a, b) => ((a.meta && a.meta.ts) || "").localeCompare((b.meta && b.meta.ts) || "");
    u.children.sort(byTs);
    for (const s of u.subAgents.values()) s.children.sort(byTs);
    const ts = allEvents(u).map((e) => e.meta && e.meta.ts).filter(Boolean).sort();
    u.ts = ts[0] || "";
  }
  units.sort((a, b) => a.ts.localeCompare(b.ts));
  return units;
}

// ---- filters -------------------------------------------------------------
function refreshFilterOptions() {
  const sess = new Set(), br = new Set(), ag = new Set();
  for (const u of allUnits) {
    for (const e of allEvents(u)) {
      if (!e.meta) continue;
      if (e.meta.session_id) sess.add(e.meta.session_id);
      if (e.meta.gitBranch) br.add(e.meta.gitBranch);
    }
    for (const s of u.subAgents.values()) ag.add(s.agentType);
  }
  syncSel(el("fSession"), sess, "All sessions", (s) => s.slice(0, 8));
  syncSel(el("fBranch"), br, "All branches", (s) => s);
  syncSel(el("fAgent"), ag, "All agents", (s) => s);
}
function syncSel(sel, values, allLabel, fmt) {
  const cur = sel.value;
  sel.innerHTML = `<option value="">${allLabel}</option>` +
    [...values].sort().map((v) => `<option value="${escAttr(v)}">${escHtml(fmt(v))}</option>`).join("");
  if ([...values].includes(cur)) sel.value = cur;
}
function applyFilters() {
  const se = el("fSession").value, be = el("fBranch").value, ae = el("fAgent").value;
  view = allUnits.filter((u) => {
    const evs = allEvents(u);
    if (se && !evs.some((e) => e.meta && e.meta.session_id === se)) return false;
    if (be && !evs.some((e) => e.meta && e.meta.gitBranch === be)) return false;
    if (ae && ![...u.subAgents.values()].some((s) => s.agentType === ae)) return false;
    return true;
  });
}

// ---- helpers -------------------------------------------------------------
function escHtml(s) { return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function escAttr(s) { return String(s).replace(/["&<>]/g, (c) => ({ '"': "&quot;", "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function fmtTime(ts) {
  if (!ts) return "?";
  const t = Date.parse(ts); if (isNaN(t)) return "?";
  if (timeFmt === "absolute") {
    const d = new Date(t), p = (n) => String(n).padStart(2, "0");
    return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 10) return "just now";
  if (s < 60) return Math.floor(s) + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}
function firstLine(obj) {
  if (!obj) return "";
  const v = obj.command || obj.file_path || obj.pattern || obj.description || obj.prompt || obj.url || "";
  const s = typeof v === "string" ? v : JSON.stringify(obj);
  return s.length > 160 ? s.slice(0, 160) + "…" : s;
}
function basename(p) { const s = String(p).split(/[\\/]/).pop(); return s || String(p); }
// Tách context harness chèn (<ide_opened_file>/<ide_selection>…) khỏi text user gõ →
// trả {text: phần user thật, atts: file/context đính kèm để render thành chip}.
function extractAttachments(text) {
  const atts = [];
  let t = String(text || "");
  t = t.replace(/<ide_opened_file>([\s\S]*?)<\/ide_opened_file>/g, (_, inner) => {
    const m = inner.match(/opened the file\s+([\s\S]+?)\s+in the IDE/i);
    const p = m ? m[1].trim() : inner.trim();
    atts.push({ label: basename(p), title: p });
    return "";
  });
  t = t.replace(/<ide_selection>([\s\S]*?)<\/ide_selection>/g, (_, inner) => {
    atts.push({ label: "selection", title: inner.trim().slice(0, 4000) });
    return "";
  });
  return { text: t.trim(), atts };
}
// Tách fenced code khỏi prose. Fence CHỈ tính khi ``` đứng ĐẦU DÒNG (bỏ khoảng trắng) —
// ``` nằm giữa dòng / trong "…" là text thường, KHÔNG phải mark.
function splitFences(text) {
  const lines = String(text).split("\n");
  const parts = [];
  let prose = [], code = [], inCode = false;
  const flushProse = () => { if (prose.length) { parts.push({ code: false, text: prose.join("\n") }); prose = []; } };
  for (const ln of lines) {
    if (/^\s*```/.test(ln)) {
      if (inCode) { parts.push({ code: true, text: code.join("\n") }); code = []; inCode = false; }
      else { flushProse(); inCode = true; }
    } else (inCode ? code : prose).push(ln);
  }
  if (inCode) prose = code;   // fence chưa đóng → phần "code" trả về prose (đừng nuốt bừa)
  flushProse();
  return parts;
}
// Trong prose: `…` (một backtick) → inline code đỏ (kiểu Slack/Claude).
function appendInline(d, text) {
  const re = /`([^`\n]+)`/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) d.appendChild(document.createTextNode(text.slice(last, m.index)));
    const c = document.createElement("code"); c.className = "ic"; c.textContent = m[1]; d.appendChild(c);
    last = re.lastIndex;
  }
  if (last < text.length) d.appendChild(document.createTextNode(text.slice(last)));
}
function renderPromptBody(container, text) {
  for (const p of splitFences(text)) {
    if (p.code) {
      const pre = document.createElement("pre"); pre.className = "prompt-code"; pre.textContent = p.text;
      container.appendChild(pre);
    } else {
      const t = p.text.replace(/^\n+|\n+$/g, ""); if (!t) continue;
      const d = document.createElement("div"); d.className = "prompt-text"; appendInline(d, t);
      container.appendChild(d);
    }
  }
}
function chipChar(e) {
  if (e.kind === "edit") return e.op === "create" ? "+" : "±";
  return e.tool === "Bash" ? "$" : (e.tool || "?").slice(0, 1);
}
function parseTotal(cr) { const m = cr && cr.match(/\/(\d+)$/); return m ? parseInt(m[1], 10) : null; }
function fmtBytes(n) { if (n == null) return ""; if (n < 1024) return n + " B"; if (n < 1048576) return (n / 1024).toFixed(1) + " KB"; return (n / 1048576).toFixed(1) + " MB"; }

// line-diff (LCS) — dựng interleaved add/del/ctx từ old_string vs new_string
function lineDiff(oldStr, newStr) {
  const a = String(oldStr).split("\n"), b = String(newStr).split("\n");
  const m = a.length, n = b.length;
  if (m * n > LCS_MAX) {  // guard: file lớn → fallback không interleave
    return a.map((t) => ({ type: "del", text: t })).concat(b.map((t) => ({ type: "add", text: t })));
  }
  const dp = Array.from({ length: m + 1 }, () => new Int32Array(n + 1));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < m && j < n) {
    if (a[i] === b[j]) { out.push({ type: "ctx", text: a[i] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push({ type: "del", text: a[i++] }); }
    else { out.push({ type: "add", text: b[j++] }); }
  }
  while (i < m) out.push({ type: "del", text: a[i++] });
  while (j < n) out.push({ type: "add", text: b[j++] });
  return out;
}

// ---- render --------------------------------------------------------------
function renderWindow(pin) {
  const atBottom = pin === "bottom" || (scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 60);
  const total = view.length;
  startIdx = Math.min(startIdx, Math.max(0, total - WINDOW));
  listEl.innerHTML = "";
  el("count").textContent = totalEvents + (totalEvents === 1 ? " event" : " events");
  if (total === 0) {
    el("loadEarlier").hidden = true; el("oldest").hidden = true;
    listEl.innerHTML = '<div class="empty"><h2>No matching events</h2><p>Điều chỉnh filter để xem toàn bộ timeline. Làm việc trong Claude Code — trail sẽ tự đầy lên đây.</p></div>';
    return;
  }
  el("loadEarlier").hidden = startIdx <= 0;
  el("oldest").hidden = startIdx > 0;
  if (startIdx > 0) el("loadEarlierBtn").textContent = "↑ Load earlier requests (" + startIdx + ")";
  const frag = document.createDocumentFragment();
  for (let i = startIdx; i < total; i++) frag.appendChild(renderGroup(view[i]));
  listEl.appendChild(frag);
  if (atBottom) jumpBottom();
}

function renderGroup(u) {
  const g = document.createElement("div"); g.className = "group";
  const inp = u.input;
  const meta = (inp || u.children[0] || {}).meta || {};
  const isSkill = inp && inp.type === "skill";
  const sysTag = (inp && !isSkill) ? systemPromptTag(inp.input && inp.input.prompt_text) : null;
  const isSystem = !!sysTag;
  const kindC = !inp ? "missing" : (isSkill ? "skill" : (isSystem ? "system" : "prompt"));

  // header
  const gh = document.createElement("div"); gh.className = "ghead";
  const rail = document.createElement("div"); rail.className = "railcol";
  const badge = document.createElement("span"); badge.className = "badge " + kindC;
  badge.innerHTML = !inp ? "!" : (isSkill ? SVG_SKILL : (isSystem ? SVG_SYSTEM : SVG_PROMPT));
  rail.appendChild(badge);
  if (u.children.length) { const c = document.createElement("span"); c.className = "connector"; rail.appendChild(c); }
  gh.appendChild(rail);

  const gb = document.createElement("div"); gb.className = "gbody";
  const kindLabel = !inp ? "unit" : (isSkill ? "Skill" : (isSystem ? "System" : "User prompt"));
  gb.innerHTML =
    `<div class="gmeta"><span class="kindpill ${kindC}">${kindLabel}</span>` +
    (isSystem ? `<span class="systag">${escHtml(sysTag)}</span>` : "") +
    `<span class="sess">${escHtml((meta.session_id || "").slice(0, 8))}</span>` +
    (meta.gitBranch ? `<span class="branch"><span class="glyph">⑂</span>${escHtml(meta.gitBranch)}</span>` : "") +
    `<span class="gtime">${escHtml(fmtTime(u.ts))}</span></div>`;
  if (!inp) {
    gb.insertAdjacentHTML("beforeend", `<div class="dangling-note">input event thiếu — chỉ có tool/edit (dangling)</div>`);
  } else if (isSystem) {
    // harness bơm (không phải user gõ) — hiện nội dung notification dạng mono/muted, tách khỏi user-prompt
    if (!kinds.system) gb.insertAdjacentHTML("beforeend", `<div class="hidden-note">System notification ẩn bởi filter</div>`);
    else { const st = document.createElement("div"); st.className = "system-text"; st.textContent = systemSummary(sysTag, inp.input.prompt_text); gb.appendChild(st); }
  } else if (!kinds.input) {
    gb.insertAdjacentHTML("beforeend", `<div class="hidden-note">Prompt ẩn bởi filter</div>`);
  } else if (isSkill) {
    const sk = inp.input || {};
    gb.insertAdjacentHTML("beforeend", `<div class="skill-text"><span class="slash">/${escHtml(sk.skill || "?")}</span> ${escHtml(sk.args || "")}</div>`);
  } else {
    const ex = extractAttachments(inp.input && inp.input.prompt_text);
    if (ex.text) renderPromptBody(gb, ex.text);
    else if (!ex.atts.length) gb.insertAdjacentHTML("beforeend", `<div class="prompt-text"></div>`);
    if (ex.atts.length) {
      const chips = ex.atts.map((a) => `<span class="att" title="${escAttr(a.title)}">${SVG_CLIP}${escHtml(a.label)}</span>`).join("");
      gb.insertAdjacentHTML("beforeend", `<div class="attachments">${chips}</div>`);
    }
  }
  gh.appendChild(gb);
  g.appendChild(gh);

  // children (gộp cặp tool+edit của cùng Write/Edit → 1 item; sub-agent nest dưới Task)
  if (u.children.length || u.subAgents.size) {
    const ch = document.createElement("div"); ch.className = "children";
    const cr = document.createElement("div"); cr.className = "crailcol";
    cr.innerHTML = '<span class="crail"></span>'; ch.appendChild(cr);
    const rows = document.createElement("div"); rows.className = "rows";
    const rendered = new Set();               // agent_id đã treo → tránh render 2 lần
    const frag = renderRows(u.children, u, rendered);
    if (!frag.childElementCount) rows.innerHTML = '<div class="nochildren">Không có tool/edit nào (bị ẩn bởi filter).</div>';
    else rows.appendChild(frag);
    // sub-agent còn sót = Task cha thiếu (bị cắt / chưa đóng) → hiện "Task cha thiếu", không bịa
    for (const [aid, sub] of u.subAgents) {
      if (!rendered.has(aid)) { rendered.add(aid); rows.appendChild(renderSubAgent(aid, sub, u, rendered, true)); }
    }
    ch.appendChild(rows);
    g.appendChild(ch);
  }
  return g;
}

function kindPass(it) {
  if (it.type === "say") return kinds.say;
  return it.type === "tool" ? kinds.tool : it.type === "edit" ? kinds.edit : (kinds.tool || kinds.edit);
}
// Render danh sách item + nest sub-agent block ngay dưới Task đã spawn nó (đệ quy → depth>1).
function renderRows(children, u, rendered) {
  const frag = document.createDocumentFragment();
  for (const it of mergeChildren(children).filter(kindPass)) {
    if (it.type === "say") { frag.appendChild(renderSay(it.say)); continue; }
    frag.appendChild(renderItem(it));
    const taskId = it.tool ? it.tool.id : null;
    const aid = taskId ? u.taskToAgent.get(taskId) : null;
    if (aid && u.subAgents.has(aid) && !rendered.has(aid)) {
      rendered.add(aid);
      frag.appendChild(renderSubAgent(aid, u.subAgents.get(aid), u, rendered, false));
    }
  }
  return frag;
}

// ---- say (narration, 011 Bước 9) -----------------------------------------
// Bong bóng lời agent. TÁCH khỏi spine bằng-chứng — bật/tắt bằng pill "Say" để soi
// say-do divergence (lời nói vs việc làm). Nội dung ở sidecar says/<id> → lazy-fetch (cache).
function renderSay(e) {
  const isSub = !!(e.meta && e.meta.agent_id);
  const wrap = document.createElement("div"); wrap.className = "say" + (isSub ? " sub" : "");
  const glyph = document.createElement("span"); glyph.className = "sayglyph"; glyph.innerHTML = SVG_SAY;
  const bubble = document.createElement("div"); bubble.className = "saybubble";
  bubble.innerHTML = '<span class="sayloading">đang tải lời…</span>';
  wrap.append(glyph, bubble);
  loadSay(e, bubble);
  return wrap;
}
function renderSayText(bubble, e, text, total) {
  bubble.innerHTML = "";
  const body = document.createElement("div"); body.className = "saytext"; body.textContent = text;
  bubble.appendChild(body);
  const meta = document.createElement("div"); meta.className = "saymeta";
  const who = (e.meta && e.meta.agent_id)
    ? "sub-agent " + escHtml(String((e.meta && e.meta.agent_type) || "?"))
    : "agent";
  meta.innerHTML = `<span>${who}</span><span>${escHtml(fmtTime(e.meta && e.meta.ts))}</span>`;
  bubble.appendChild(meta);
  if (total && total > RESULT_CAP) {
    const b = document.createElement("button"); b.className = "sayfull";
    b.textContent = "⤓ Toàn bộ lời (" + fmtBytes(total) + ")";
    b.onclick = () => loadSay(e, bubble, true);
    bubble.appendChild(b);
  }
}
async function loadSay(e, bubble, full) {
  if (typeof e.text === "string") { renderSayText(bubble, e, e.text, null); return; }  // inline (nếu log nhúng)
  if (!e.say_ref) { bubble.innerHTML = '<span class="sayloading">(lời thiếu — không ghi được)</span>'; return; }
  const cached = sayCache.get(e.id);
  if (cached && (cached.full || !full)) { renderSayText(bubble, e, cached.text, cached.total); return; }
  try {
    const headers = full ? {} : { Range: `bytes=0-${RESULT_CAP - 1}` };
    const res = await fetch("says/" + encodeURIComponent(e.id), { headers, cache: "no-store" });
    if (!res.ok && res.status !== 206) throw new Error("HTTP " + res.status);
    const total = parseTotal(res.headers.get("Content-Range"));
    const c = { text: await res.text(), total, full: !!full };
    sayCache.set(e.id, c);
    renderSayText(bubble, e, c.text, total);
  } catch (err) {
    bubble.innerHTML = `<span class="sayloading">không tải được lời: ${escHtml(err.message)}</span>`;
  }
}
function renderSubAgent(aid, sub, u, rendered, orphan) {
  const box = document.createElement("div"); box.className = "subagent" + (orphan ? " orphan" : "");
  const head = document.createElement("div"); head.className = "sahead";
  head.innerHTML =
    `<span class="satag">${SVG_AGENT}sub-agent</span>` +
    `<span class="satype">${escHtml(sub.agentType || "?")}</span>` +
    `<span class="saId">${escHtml(String(aid).slice(0, 8))}</span>` +
    (orphan ? `<span class="saorphan">Task cha thiếu</span>` : "");
  box.appendChild(head);
  const inner = document.createElement("div"); inner.className = "sarows";
  const frag = renderRows(sub.children, u, rendered);
  if (!frag.childElementCount) inner.innerHTML = '<div class="nochildren">Không có tool/edit nào (bị ẩn bởi filter).</div>';
  else inner.appendChild(frag);
  box.appendChild(inner);
  return box;
}

// Write/Edit phát CẢ tool (process) + edit (output) cùng tool_use_id (007 §5).
// Gộp cặp thành 1 render-item để human khỏi thấy nhân đôi (log dưới nền vẫn 2 event).
function mergeChildren(children) {
  const toolIds = new Set(children.filter((c) => c.kind === "tool").map((c) => c.id));
  const items = [];
  for (const e of children) {
    if (e.kind === "say") { items.push({ type: "say", say: e }); }   // lời agent (011 Bước 9)
    else if (e.kind === "tool") {
      const ed = children.find((c) => c.kind === "edit" && c.id === e.id + "#edit");
      items.push(ed ? { type: "editaction", tool: e, edit: ed } : { type: "tool", tool: e });
    } else if (e.kind === "edit") {
      if (!toolIds.has(e.id.replace(/#edit$/, ""))) items.push({ type: "edit", edit: e }); // dangling edit
    }
  }
  return items;
}
function itemKind(it) { return it.type === "tool" ? "tool" : "edit"; }  // dùng cho filter pill

function renderItem(it) {
  let editStyle, ch, label, summary, warn, key, timeEv, populateFn;
  if (it.type === "tool" && it.tool.tool === "AskUserQuestion") {
    const e = it.tool; const qs = (e.tool_input && e.tool_input.questions) || [];
    editStyle = false; ch = "?"; label = "AskUserQuestion";
    summary = ((qs[0] && qs[0].question) || "") + (qs.length > 1 ? ` (+${qs.length - 1} câu)` : "");
    warn = !e.result_ref ? "no answer" : ""; key = e.id; timeEv = e; populateFn = (p) => populateAsk(e, p);
  } else if (it.type === "tool") {
    const e = it.tool; editStyle = false; ch = chipChar(e); label = e.tool || "?"; summary = firstLine(e.tool_input);
    warn = !e.result_ref ? "no result" : ""; key = e.id; timeEv = e; populateFn = (p) => populateTool(e, p);
  } else if (it.type === "edit") {
    const e = it.edit; editStyle = true; ch = chipChar(e); label = e.op === "create" ? "Create" : "Edit"; summary = e.file || "?";
    warn = !e.diff_ref ? "no diff" : ""; key = e.id; timeEv = e; populateFn = (p) => populateEdit(e, p);
  } else {
    const t = it.tool, ed = it.edit; editStyle = true; ch = chipChar(ed);
    label = t.tool || "?"; summary = ed.file || "?"; warn = ""; key = t.id; timeEv = t;
    populateFn = (p) => populateEdit(ed, p);  // Write/Edit: chỉ diff (Input/Result = dạng thô của diff, thừa)
  }
  const row = document.createElement("div"); row.className = "row" + (expanded.has(key) ? " open" : "");
  const head = document.createElement("button"); head.className = "rowhead";
  head.innerHTML =
    `<span class="chip ${editStyle ? "edit" : "tool"}">${escHtml(ch)}</span>` +
    `<span class="clabel">${escHtml(label)}</span>` +
    `<span class="csummary">${escHtml(summary)}</span>` +
    (warn ? `<span class="cmeta">${escHtml(warn)}</span>` : "") +
    `<span class="ctime">${escHtml(fmtTime(timeEv && timeEv.meta && timeEv.meta.ts))}</span>` +
    `<span class="caret">›</span>`;
  const body = document.createElement("div"); body.className = "cbody";
  row.append(head, body);
  const build = () => { const p = document.createElement("div"); p.className = "panel"; body.appendChild(p); populateFn(p); };
  head.addEventListener("click", () => {
    const open = !row.classList.contains("open");
    row.classList.toggle("open", open);
    if (open) { expanded.add(key); if (!body.childElementCount) build(); }
    else expanded.delete(key);
  });
  if (expanded.has(key)) build();   // re-render: dựng lại body (cache → không refetch)
  return row;
}

function populateTool(e, panel) {
  // Input params (inline — có sẵn trong log)
  const sIn = document.createElement("div"); sIn.className = "psec";
  const pre = document.createElement("pre"); pre.textContent = JSON.stringify(e.tool_input || {}, null, 2);
  sIn.innerHTML = '<div class="plabel">Input</div>'; sIn.appendChild(pre); panel.appendChild(sIn);
  // Result (lazy)
  const sRes = document.createElement("div"); sRes.className = "psec";
  const lbl = document.createElement("div"); lbl.className = "plabel";
  const badge = document.createElement("span"); badge.className = "blobbadge";
  lbl.append(document.createTextNode("Result "), badge); sRes.appendChild(lbl);
  const holder = document.createElement("div"); sRes.appendChild(holder); panel.appendChild(sRes);
  if (!e.result_ref) {
    badge.textContent = "not recorded"; badge.classList.add("warn");
    holder.innerHTML = '<div class="miss"><span class="bang">!</span><span>Không có result — tool call được ghi nhưng output thì không (007 §6, best-effort).</span></div>';
    return;
  }
  badge.textContent = "tool-results/" + e.id;
  loadResult(e.id, holder, badge, false);
}

function renderResult(id, holder, badge, c) {
  if (badge) badge.textContent = "tool-results/" + id + (c.total ? " · " + fmtBytes(c.total) : "");
  holder.innerHTML = "";
  const pre = document.createElement("pre"); pre.className = "result"; pre.textContent = c.text; holder.appendChild(pre);
  if (!c.full && c.total && c.total > RESULT_CAP) {
    const b = document.createElement("button"); b.className = "loadfull";
    b.textContent = "⤓ Tải toàn bộ (" + fmtBytes(c.total) + ")";
    b.onclick = () => loadResult(id, holder, badge, true);
    holder.appendChild(b);
  }
}
async function loadResult(id, holder, badge, full) {
  const cached = resultCache.get(id);
  if (cached && (cached.full || !full)) { renderResult(id, holder, badge, cached); return; }
  holder.innerHTML = '<div class="dark-loading">đang tải…</div>';
  try {
    const headers = full ? {} : { Range: `bytes=0-${RESULT_CAP - 1}` };
    const res = await fetch("tool-results/" + encodeURIComponent(id), { headers, cache: "no-store" });
    if (!res.ok && res.status !== 206) throw new Error("HTTP " + res.status);
    const total = parseTotal(res.headers.get("Content-Range"));
    const c = { text: await res.text(), total, full: !!full };
    resultCache.set(id, c);
    renderResult(id, holder, badge, c);
  } catch (err) {
    holder.innerHTML = `<div class="miss"><span class="bang">!</span><span>không tải được result: ${escHtml(err.message)}</span></div>`;
  }
}

// AskUserQuestion: parse chuỗi result `"Q"="A", …` (anchor bằng chính text câu hỏi →
// bền với dấu phẩy/ngoặc trong đáp án). Trả {question: answer|null}.
function parseAsk(text, questions) {
  const ans = {};
  for (let i = 0; i < questions.length; i++) {
    const q = questions[i].question || "";
    const key = '"' + q + '"="';
    const start = text.indexOf(key);
    if (start < 0) { ans[q] = null; continue; }
    const from = start + key.length;
    let end = -1;
    if (i + 1 < questions.length) end = text.indexOf('", "' + (questions[i + 1].question || "") + '"="', from);
    if (end < 0) { const suf = text.indexOf('". You can now continue', from); end = suf >= 0 ? suf : text.length; }
    ans[q] = text.slice(from, end);
  }
  return ans;
}
// Đối chiếu đáp án với option.label → {chosen:Set, custom:[], unanswered}.
function matchAnswer(q, answer) {
  const labels = (q.options || []).map((o) => o.label), chosen = new Set(), custom = [];
  if (answer == null) return { chosen, custom, unanswered: true };
  if (labels.includes(answer)) { chosen.add(answer); return { chosen, custom }; }
  if (q.multiSelect) for (const tok of answer.split(", ")) { if (labels.includes(tok)) chosen.add(tok); else custom.push(tok); }
  else custom.push(answer);   // single-select không khớp nhãn = Other tự gõ
  return { chosen, custom };
}
async function populateAsk(e, panel) {
  const qs = (e.tool_input && e.tool_input.questions) || [];
  panel.classList.add("ask");
  let ansMap = {};
  if (e.result_ref) {
    panel.innerHTML = '<div class="dark-loading" style="padding:12px 16px">đang tải đáp án…</div>';
    try {
      const c = resultCache.get(e.id);
      let text;
      if (c && c.full) text = c.text;
      else { const r = await fetch("tool-results/" + encodeURIComponent(e.id), { cache: "no-store" }); if (!r.ok) throw new Error("HTTP " + r.status); text = await r.text(); resultCache.set(e.id, { text, full: true }); }
      ansMap = parseAsk(text, qs);
    } catch { /* vẫn render câu hỏi, đáp án để trống */ }
  }
  panel.innerHTML = "";
  if (!qs.length) { panel.innerHTML = '<div class="dark-loading" style="padding:12px 16px">không có câu hỏi</div>'; return; }
  for (const q of qs) {
    const block = document.createElement("div"); block.className = "ask-q";
    const head = document.createElement("div"); head.className = "ask-qhead";
    head.innerHTML = `<span class="ask-tag">${escHtml(q.header || "")}</span>`;
    const qt = document.createElement("span"); qt.className = "ask-qtext"; qt.textContent = q.question || "";
    head.appendChild(qt); block.appendChild(head);
    const opts = document.createElement("div"); opts.className = "ask-opts";
    const m = matchAnswer(q, ansMap[q.question]);
    for (const o of (q.options || [])) {
      const chosen = m.chosen.has(o.label);
      const row = document.createElement("div"); row.className = "ask-opt" + (chosen ? " chosen" : "");
      const mk = document.createElement("span"); mk.className = "ask-mark"; mk.textContent = chosen ? "✓" : "○";
      const lb = document.createElement("span"); lb.textContent = o.label;
      row.append(mk, lb); opts.appendChild(row);
    }
    for (const cst of m.custom) {
      const row = document.createElement("div"); row.className = "ask-opt chosen custom";
      const mk = document.createElement("span"); mk.className = "ask-mark"; mk.textContent = "✎";
      const lb = document.createElement("span"); lb.innerHTML = '<span class="ask-other">tự trả lời:</span> ';
      lb.appendChild(document.createTextNode(cst));
      row.append(mk, lb); opts.appendChild(row);
    }
    if (m.unanswered) { const n = document.createElement("div"); n.className = "ask-none"; n.textContent = "chưa có đáp án (bị cắt / không ghi)"; opts.appendChild(n); }
    block.appendChild(opts); panel.appendChild(block);
  }
}
async function populateEdit(e, panel) {
  const head = document.createElement("div"); head.className = "diff-head";
  head.innerHTML = `<code class="path">${escHtml(e.file || "?")}</code>`;
  panel.appendChild(head);
  const holder = document.createElement("div"); panel.appendChild(holder);
  if (!e.diff_ref) {
    holder.innerHTML = '<div class="miss" style="margin:12px 16px"><span class="bang">!</span><span>Không có diff — blob bị thiếu trong log store.</span></div>';
    return;
  }
  const cached = diffCache.get(e.id);
  if (cached) { renderDiff(cached, head, holder); return; }
  holder.innerHTML = '<div class="dark-loading" style="padding:12px 16px">đang tải diff…</div>';
  try {
    const res = await fetch("diff/" + encodeURIComponent(e.id), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    let obj = null; try { obj = JSON.parse(await res.text()); } catch { /* */ }
    let c;
    if (obj && ("old_string" in obj || "new_string" in obj)) c = { lines: lineDiff(obj.old_string || "", obj.new_string || "") };
    else if (obj && "content" in obj) c = { lines: String(obj.content).split("\n").map((t) => ({ type: "add", text: t })) };
    else c = { raw: JSON.stringify(obj, null, 2) };
    if (c.lines) { c.adds = c.lines.filter((l) => l.type === "add").length; c.dels = c.lines.filter((l) => l.type === "del").length; }
    diffCache.set(e.id, c);
    renderDiff(c, head, holder);
  } catch (err) {
    holder.innerHTML = `<div class="miss" style="margin:12px 16px"><span class="bang">!</span><span>không tải được diff: ${escHtml(err.message)}</span></div>`;
  }
}
function renderDiff(c, head, holder) {
  holder.innerHTML = "";
  if (c.raw) { const pre = document.createElement("pre"); pre.style.padding = "12px 16px"; pre.textContent = c.raw; holder.appendChild(pre); return; }
  if (!head.querySelector(".adds")) head.insertAdjacentHTML("beforeend", `<span class="adds">+${c.adds}</span><span class="dels">−${c.dels}</span>`);
  const box = document.createElement("div"); box.className = "difflines";
  for (const l of c.lines) {
    const d = document.createElement("div"); d.className = "dl " + l.type;
    const sign = l.type === "add" ? "+" : l.type === "del" ? "−" : "";
    d.innerHTML = `<span class="sign">${sign}</span><span class="txt"></span>`;
    d.querySelector(".txt").textContent = l.text;
    box.appendChild(d);
  }
  holder.appendChild(box);
}

function jumpBottom() { scrollEl.scrollTop = scrollEl.scrollHeight; }

// ---- load earlier (scroll-up windowed) -----------------------------------
function loadEarlier() {
  if (startIdx <= 0) return;
  const prevH = scrollEl.scrollHeight, prevTop = scrollEl.scrollTop;
  startIdx = Math.max(0, startIdx - WINDOW);
  renderWindow("keep");
  scrollEl.scrollTop = scrollEl.scrollHeight - prevH + prevTop;
}
scrollEl.addEventListener("scroll", () => { if (scrollEl.scrollTop < 60 && startIdx > 0) loadEarlier(); });

// ---- main cycle ----------------------------------------------------------
async function refresh(initial) {
  try {
    const text = await fetchLog();
    if (text === null) {                       // 304 — không đổi
      if (timeFmt === "relative") renderWindow("keep");  // vẫn làm mới "x phút trước"
      return;
    }
    const wasBottom = scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 60;
    allUnits = buildUnits(parse(text));
    refreshFilterOptions();
    applyFilters();
    if (initial) startIdx = Math.max(0, view.length - WINDOW);
    renderWindow(wasBottom || initial ? "bottom" : "keep");
  } catch (err) {
    el("count").textContent = "lỗi: " + err.message;
  }
}
function rerender() { applyFilters(); startIdx = Math.max(0, view.length - WINDOW); renderWindow("bottom"); }

// ---- controls ------------------------------------------------------------
el("fSession").addEventListener("change", rerender);
el("fBranch").addEventListener("change", rerender);
el("fAgent").addEventListener("change", rerender);
for (const id of ["pInput", "pTool", "pEdit", "pSay", "pSystem"]) el(id).addEventListener("click", () => {
  const k = el(id).dataset.kind; kinds[k] = !kinds[k];
  el(id).classList.toggle("on", kinds[k]);
  renderWindow("keep");
});
el("loadEarlierBtn").addEventListener("click", loadEarlier);
el("liveBtn").addEventListener("click", () => {
  live = !live;
  el("liveBtn").classList.toggle("paused", !live);
  el("liveLabel").textContent = live ? "Live" : "Paused";
});
function setTimeFmt(f) {
  timeFmt = f;
  el("segRel").classList.toggle("on", f === "relative");
  el("segAbs").classList.toggle("on", f === "absolute");
  renderWindow("keep");
}
el("segRel").addEventListener("click", () => setTimeFmt("relative"));
el("segAbs").addEventListener("click", () => setTimeFmt("absolute"));

// theme (light/dark) — mặc định theo OS; nút ép override; icon phản ánh mode hiện tại
const mq = matchMedia("(prefers-color-scheme: dark)");
function currentTheme() { return document.documentElement.getAttribute("data-theme") || (mq.matches ? "dark" : "light"); }
function syncThemeBtn() {
  const dark = currentTheme() === "dark";
  el("themeBtn").innerHTML = dark ? SVG_SUN : SVG_MOON;
  el("themeBtn").title = dark ? "Chuyển sang light" : "Chuyển sang dark";
}
el("themeBtn").addEventListener("click", () => {
  document.documentElement.setAttribute("data-theme", currentTheme() === "dark" ? "light" : "dark");
  syncThemeBtn();
});
if (mq.addEventListener) mq.addEventListener("change", () => { if (!document.documentElement.getAttribute("data-theme")) syncThemeBtn(); });
syncThemeBtn();

(async function start() {
  await refresh(true);
  setInterval(() => { if (live) refresh(false); else if (timeFmt === "relative") renderWindow("keep"); }, POLL_MS);
})();
</script>
